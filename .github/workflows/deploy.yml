name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; nothing else does.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Don't cancel a run in progress -- a half-finished
# deployment is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Runs before the build so a parser regression blocks the deploy as surely
      # as a validation failure does.
      - name: Test
        run: pytest -q

      # Exits non-zero on any vocabulary, encoding or format violation and writes
      # no output, so a bad push fails here and the live site is left alone.
      - name: Build
        run: python -m src.build --strict

      - name: Check the corpus was not modified
        run: git diff --exit-code -- recipes/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
